name: 化學反應實驗室
description: 國中理化互動實驗遊戲，讓學生配對物質、觀察反應現象，並核對配平化學方程式與生活實例。
educatorSummary: |
  化學反應實驗室以 10 個任務帶領學生探索酸鹼中和、氣體製備與檢驗、金屬置換及沉澱反應。學生先從實驗架選兩種物質放入燒杯，再觀察冒泡、放熱、變色或沉澱動畫；成功後會顯示含物質狀態的配平方程式、實驗現象與生活連結。答錯時先提供提示，再次答錯才揭示答案，也能辨認其實屬於其他任務的有效反應，適合用於國中理化的預習、課堂推理或複習活動。
