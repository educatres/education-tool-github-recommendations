educationLevels:
  - 中小學
useCases:
  - 在實作實驗前，讓學生預測反應物、反應現象與生成物
  - 練習配平化學方程式，並辨認固體、液體、氣體與水溶液狀態
  - 將 10 個任務分類為酸鹼中和、產氣、置換與沉澱反應
cautions:
  - 遊戲中的多種藥品具腐蝕性或其他危險，真實實驗必須由教師依安全規範指導
  - 模擬只收錄任務使用的反應，畫面顯示無反應不代表物質在真實條件下一定不反應
  - 完成紀錄只保存在目前瀏覽器，換裝置或清除網站資料後不會保留
language: HTML
install: |
  可直接開啟 GitHub Pages 線上版本；離線使用時下載 repository 根目錄的 index.html，以現代瀏覽器直接開啟即可，不需安裝、登入或連線。
