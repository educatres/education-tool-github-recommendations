name: 蛙骨拼圖
description: 以青蛙背面骨骼為主題的雙語拼圖與名稱練習，涵蓋 56 塊骨頭及 28 種解剖名稱。
educatorSummary: |
  蛙骨拼圖適合高中生物、大學普通生物學、動物學與比較解剖學課程。第一關讓學生把 56 塊骨頭拖放到青蛙骨架的正確位置，第二關則以拖曳標籤或自行輸入方式標示 28 種骨頭名稱；中文、英文、常見別名與部分簡體名稱皆可判定。系統提供輪廓、位置提示、分類著色、中英文說明、錯誤次數與完成時間，能用於解剖或標本觀察前的預習，以及課後位置與術語複習。
