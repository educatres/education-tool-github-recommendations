useCases:
  - 在觀察實體標本或進行解剖前，預習青蛙骨骼的相對位置
  - 以中英文雙語練習頭骨、中軸骨、肩帶、腰帶及四肢骨名稱
  - 比較青蛙與其他脊椎動物的骨骼構造、移動方式與適應差異
cautions:
  - 骨架是以赤蛙屬背面觀製作的簡化原創示意圖，不能取代實體標本或專業解剖圖譜
  - 部分腹面骨頭未收錄，不同蛙種的骨骼比例、指骨數與橫突形態也可能不同
  - 手機和平板可用點選方式操作，但完整拖曳與標示活動以電腦滑鼠較順暢
language: HTML
install: |
  可直接開啟 GitHub Pages 線上版本；離線時下載單一 index.html，以瀏覽器開啟即可，不需安裝、登入或連線。
