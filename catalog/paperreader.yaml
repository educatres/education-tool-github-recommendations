useCases:
  - 在文獻閱讀課中標記論點與證據，建立附有來源位置的閱讀便條
  - 將多篇論文的便條放到知識白板，人工連結相同主題、差異與待查問題
  - 用 AI 翻譯與摘要輔助閱讀，再回到原文核對術語、脈絡與引用
cautions:
  - AI 功能需自行提供支援服務的 API key，可能產生用量費用；送出前應確認文字傳送範圍及供應商的資料處理規範
  - 研究資料儲存在目前瀏覽器，沒有帳號或跨裝置同步；應定期匯出含 PDF 與附件的 `.researchpack` 完整備份
  - 掃描 PDF 不會自動 OCR，複雜版面與公式的文字擷取可能不完整；翻譯和摘要仍需對照原文查證
language: TypeScript
install: |
  直接開啟 GitHub Pages 線上版本，建立研究專案並匯入 PDF 或試讀範例。標記、便條與白板功能可先使用；需要 AI 翻譯或摘要時，再於「連接你的 AI」選擇供應商、輸入自己的 API key 並測試連線。本機開發可依 GitHub README 使用 Node.js 24 以上版本，執行 `npm ci` 與 `npm run dev`。
