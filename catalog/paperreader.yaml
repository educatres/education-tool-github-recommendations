name: PaperReader｜PDF 研究閱讀工作台
description: 結合 PDF 標記、研究便條、知識白板與 AI 翻譯摘要的瀏覽器工具，協助整理多篇文獻並保留可回查的原文位置。
educatorSummary: |
  PaperReader 是繁體中文的個人研究工作台，可在瀏覽器建立多個研究專案，匯入 PDF 後選字標記、建立來源便條，並在白板上整理便條與人工連線。標記與便條可回到原文頁面；也能使用自備的 AI API key 翻譯便條、逐段翻譯 PDF 文字、摘要單篇內容或整合相連便條。PDF、標記與筆記主要保存在目前瀏覽器，完整研究封裝可匯出作為備份及搬移資料。適合大學生、研究生與教師在文獻閱讀、比較觀點及研究構想整理時使用。
authorName: educatres
