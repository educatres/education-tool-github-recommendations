educationLevels:
  - 中小學
  - 高中
useCases:
  - 比較同一年代不同地區的事件、人物與政權變化，建立跨區域的時間脈絡
  - 搭配分層地圖探討臺灣史中的海域勢力、移民移動、行政建置與國際關係
  - 讓學生運用主題目錄與搜尋功能蒐集線索，練習提出歷史問題並整理證據
cautions:
  - 目前為 beta 版本且內容持續擴充，授課前宜先確認所需年代、主題與資料是否完整
  - 時間軸與地圖是理解歷史脈絡的輔助介面，仍應搭配課本、原始史料及教師說明辨析因果與爭議
  - 正式資料與保留的測試資料用途不同，設計學習單時應以介面標示的正式內容及其來源為準
language: TypeScript
install: |
  可直接開啟 GitHub Pages 線上版本使用，無需註冊。若要本機執行或修改，請依 GitHub README 安裝 Node.js 相依套件並執行專案的驗證、測試與建置指令。
