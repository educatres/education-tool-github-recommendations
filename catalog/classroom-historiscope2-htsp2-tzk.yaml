name: 歷史的平行一刻
description: 結合歷史時間軸、人物與時點地圖的互動探索工具，協助學生比較不同年代、區域與主題之間的歷史脈絡。
educatorSummary: |
  歷史的平行一刻（Historiscope）是一套可直接在瀏覽器操作的互動歷史教材，以同步時間軸、人物與主題目錄、搜尋面板及分層地圖呈現臺灣與世界史料。現有內容涵蓋 17 世紀臺灣海域勢力與政權轉換、清初政權接管及移民政策、日治至戰後的人口移動，以及戰後臺灣國際關係等主題。學生可逐年移動時間、切換事件與人物、沿垂直對齊線比較同時期內容，並從洲、國、州省到城市的地圖層級理解事件的空間關係，適合國中與高中歷史、社會領域的時空脈絡教學、專題探究與史料閱讀活動。
authorName: kisaraki
authorGitHub: kisaraki
