name: 披薩比一比
description: 用披薩圖像練習分數大小比較的國小數學遊戲，涵蓋同分母、同分子、異分母與等值分數。
educatorSummary: |
  披薩比一比把兩個分數畫成小熊與小兔的披薩，請學生依題目選出較多、較少或一樣多的一盤。簡單模式處理同分母比較，進階模式聚焦同分子時分母愈大、每份愈小，困難模式加入異分母與等值分數。第一次答錯會以等長分數條提供視覺提示，並逐步帶出「同分母比分子」「同分子比分母」及通分策略；再次答錯才揭示答案。工具支援分數讀法、注音、鍵盤、觸控、音效與離線使用，適合國小分數概念教學和補救練習。
