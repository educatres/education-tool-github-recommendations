useCases:
  - 以披薩圖像連結分數符號、讀法與部分量概念
  - 分階段練習同分母、同分子、異分母和等值分數比較
  - 搭配紙盤或色紙實作，讓學生切分、疊合並說明比較理由
cautions:
  - 應要求學生說明比較策略，避免只依塗色面積猜答案而未連結到分子與分母
  - 進入異分母題目前，建議先確認學生理解單位分數與等值分數
  - 最佳成績只保存在目前瀏覽器，換裝置或清除網站資料後不會保留
