name: 咕咕鐘
description: 國小時鐘學習遊戲，透過九步教學、看時鐘與撥時鐘練習，建立整點、半點與幾時幾分概念。
educatorSummary: |
  咕咕鐘以可操作的類比鐘面協助國小學生認識 1～12、長短針、分鐘刻度、整點、半點與幾時幾分。九步教學單元會逐段示範鐘面與指針規律，之後可進入「看時鐘選答案」或「依題目撥指針」兩種模式，並依整點與半點、每 5 分鐘及每 1 分鐘分成三種難度。針對長短針混淆、把鐘面數字直接當分鐘或快到整點時判讀錯誤等常見迷思，系統會提供對應提示與視覺輔助，也支援注音、音效、觸控操作及錯題回顧。
