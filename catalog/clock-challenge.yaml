educationLevels:
  - 小學
useCases:
  - 初次教學時用九步單元示範鐘面、長短針與 60 分鐘等於 1 小時
  - 讓學生先練習讀鐘，再以拖曳或按鈕撥出指定時間
  - 透過錯題小時鐘診斷長短針、五個一數與跨整點判讀迷思
cautions:
  - 建議先依學生程度選擇整點半點、每 5 分鐘或每 1 分鐘的題目，避免一次加入太多規則
  - 首頁時鐘使用裝置時間，若電腦或平板時間設定錯誤，顯示也會跟著不正確
  - 最佳成績只保存在目前瀏覽器；意見回饋按鈕會另開 Google 表單並需要網路
language: HTML
install: |
  可直接開啟 GitHub Pages 線上版本；若需離線使用，下載 index.html 後以電腦、平板或手機瀏覽器直接開啟即可。
