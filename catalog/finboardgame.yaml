name: 經濟棋局｜多人財經桌遊
description: 2–8 人輪流經營企業的瀏覽器財經桌遊，透過事件卡、收支決策與總體經濟儀表板，探索經濟變動對企業淨資產的影響。
educatorSummary: |
  經濟棋局讓 2–8 位玩家在同一台電腦上輪流操作，各自選擇不同企業，在 24 格棋盤上前進、抽取全球、個人或產業事件，並決定聘僱、裁員、借款或還款。每位玩家完成行動後，遊戲結算一季，呈現企業收支與總體經濟快照；「AI 聯準會」依十條預設規則決定下一季政策。教師可用它引導學生比較產業衝擊、現金流、負債與淨資產，以及政策變化如何影響不同企業。可調整勝利淨資產目標與季數上限，並用歷史紀錄回顧決策與結果。
authorName: educatres
authorGitHub: educatres
repo: educatres/finboardgame
homepage:
launchUrl: https://educatres.github.io/finboardgame/
tags:
  - education
  - teaching
  - github
  - economics
  - board-game
  - simulation
educationLevels:
  - 大學
useCases:
  - 分組扮演不同企業，討論同一全球事件與產業事件對各角色收支的不同影響
  - 比較聘僱、裁員、借款與還款後的現金、負債及淨資產變化
  - 利用總體經濟儀表板、聯準會規則與歷史紀錄，討論政策決策與遊戲結果
cautions:
  - 遊戲中的企業數值與經濟規則是教學情境假設，不代表真實市場預測或投資建議
  - 需由 2–8 位玩家輪流操作；若開啟多個同步頁籤，應使用同一瀏覽器及相同網址
  - 對局會自動儲存在目前瀏覽器，也可匯出 JSON 存檔；換裝置或清除瀏覽器資料前，請先匯出需要保留的紀錄
language: JavaScript
install: |
  直接開啟 GitHub Pages 線上版本，設定 2–8 位玩家、企業、淨資產目標與最多季數即可開始。若要本機使用，可從 GitHub 下載專案並直接開啟 index.html；需要在同一瀏覽器跨頁籤同步對局時，於專案資料夾執行 `node serve.mjs`，再以相同的 http://127.0.0.1:4173/ 網址開啟各頁籤。
