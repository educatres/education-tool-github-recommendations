name: 加減乘除大挑戰
description: 國小加減乘除分級練習與雙隊搶答遊戲，提供概念提示、個人紀錄和投影課堂模式。
educatorSummary: |
  加減乘除大挑戰提供加法、減法、乘法、除法與四則綜合題，依 10 以內、20 以內進退位、兩位數及九九乘除等內容分成三種難度。個人賽包含四選一、自行輸入、限時與未知數填空題，答錯時會以十格框、湊十、破十、分糖果或拆數等國小常見策略給提示；學生也能建立多位本機玩家，輪流累積星星。分組賽則讓兩隊以 A、L 鍵搶答，適合一台電腦接投影機進行課堂暖身或複習。
