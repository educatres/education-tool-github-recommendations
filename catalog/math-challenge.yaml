useCases:
  - 依年級與學習狀況選擇四則運算題型和難度，進行個別流暢度練習
  - 用錯題提示觀察學生在進位、退位、乘法或等分概念上的卡點
  - 以分組搶答進行課堂暖身、單元複習或小組合作競賽
cautions:
  - 分組搶答使用 A、L 鍵，活動前宜把輸入法切換為英文並確認鍵盤位置
  - 限時與競賽模式可能增加部分學生壓力，建議保留不限時個人練習與合作說明機會
  - 玩家名稱、星星與進度只保存在目前瀏覽器，不宜使用可識別學生身分的完整姓名
language: HTML
install: |
  可直接開啟 GitHub Pages 線上版本；離線使用時下載 index.html，以電腦、平板或手機瀏覽器直接開啟即可。
