educationLevels:
  - 中小學
  - 高中
useCases:
  - 調整海溫、風切、環境導引與初始強度，進行控制變因及因果推論活動
  - 比較颱風登陸臺灣、再出海與地形交互作用，討論路徑、強度及測站風雨差異
  - 使用固定 seed、操作紀錄與可重現關卡，安排小組預測、結果驗證及科學論證
cautions:
  - 模型為教育用途的刻意簡化，關卡僅受歷史事件啟發，不是真實歷史重建，也不可用於天氣預報、防災或其他安全決策
  - 介面包含多項環境參數、地圖操作與觀測資訊，建議教師先示範關卡目標與主要變因，再讓學生分組探究
  - 執行效能會受裝置與瀏覽器影響；若動畫不順，可調低粒子層級或開啟減少動態模式
language: JavaScript
install: |
  可直接開啟 GitHub Pages 線上版本使用，無需登入、資料庫或 API key。若要本機執行，需安裝 Node.js 24 LTS 與 npm 11，下載或 clone 專案後執行 npm ci，再以 npm run serve 啟動並開啟 http://127.0.0.1:4173/classroom-sgts-nh-tzk/。
