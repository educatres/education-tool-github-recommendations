name: 風暴創世神：北半球颱風模擬器
description: 以西北太平洋熱帶氣旋為題材的互動科學模擬器，讓學生探索海溫、風切、地形、環境導引與冷水尾流如何影響颱風路徑、強度及測站風雨。
educatorSummary: |
  風暴創世神（SGTS-NH）是一套純前端的北半球颱風互動模擬器，以固定時間步進及具種子的可重現模型呈現熱帶氣旋發展。學生可體驗「那霸風雨」、「護國神山」與「韋恩三進」三個資料驅動關卡，或在無勝敗沙盒中自訂生成點、強度、海洋及環境條件，觀察太平洋副熱帶高壓、西南季風、垂直風切、臺灣地形、登陸再出海與冷水尾流等因素如何改變颱風。六個測站會同步呈現模型風雨資料，適合用於國中、高中地球科學的概念探究、變因比較、歷史颱風情境討論與遊戲化學習。
